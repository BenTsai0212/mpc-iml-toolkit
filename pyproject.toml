[project]
name = "mpc-iml-toolkit"
version = "0.1.0"
description = "Base toolkit for interactive machine learning with an Akai MPC Sample and a Mac."
readme = "README.md"
requires-python = "==3.12.*"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "BenTsai0212" }]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
dependencies = [
    "python-osc>=1.10.3",
    "python-rtmidi>=1.5.8",
    "scikit-learn>=1.5",
]

[project.entry-points."mpc_iml.presets"]
demo = "mpc_iml.demo:PRESET"

[dependency-groups]
dev = ["mypy", "pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mpc_iml"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["rtmidi", "rtmidi.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-m", "not hardware"]
markers = [
    "hardware: needs a connected MPC Sample; skipped by default, run with `uv run pytest -m hardware`",
]

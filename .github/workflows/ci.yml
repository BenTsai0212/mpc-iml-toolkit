name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Workflow tool tests
        run: npm test --prefix tools/workflow
      - uses: astral-sh/setup-uv@v6
      - name: uv sync
        run: uv sync --locked --extra demo
      - name: ruff check
        run: uv run ruff check
      - name: ruff format
        run: uv run ruff format --check
      - name: mypy
        run: uv run mypy
      - name: pytest
        run: uv run pytest
      - name: Practice template installs and runs
        run: |
          uv run python -m mpc_iml.new "$RUNNER_TEMP/my-practice"
          cd "$RUNNER_TEMP/my-practice"
          uv add --editable "$GITHUB_WORKSPACE"
          uv run python -m my_practice tests/data/example.jsonl
          uv run pytest
